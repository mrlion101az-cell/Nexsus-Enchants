name: NexusEnchants
version: 0.10.0
main: com.nexusuniverse.enchants.NexusEnchantsPlugin
api-version: '1.21'
author: Nexus Universe
description: Custom "enchantments" for weapons, armor, tools, bows, crossbows, fishing rods, shields, tridents, shears, elytra, maces, horse armor, compasses, totems, spyglasses, carved pumpkins, firework rockets, and leads -- 184 total plus Lava/Tide Walker.

commands:
